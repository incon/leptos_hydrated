[package]
name = "leptos_hydrated"
version = "0.9.0"

edition = "2024"
authors = ["David Darrell"]
license = "MIT"
description = "A component to hydrate and manage interactive hydration state in Leptos 0.8"
keywords = ["leptos", "ssr", "hydration", "wasm"]
categories = ["web-programming"]
repository = "https://github.com/incon/leptos_hydrated"
readme = "README.md"
documentation = "https://docs.rs/leptos_hydrated"
[features]
ssr = [
    "leptos/ssr",
    "dep:axum",
    "dep:serde_json",
    "dep:leptos_axum",
    "dep:serde_urlencoded",
    "dep:futures-util",
]
hydrate = [
    "leptos/hydrate",
    "dep:serde-wasm-bindgen",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:web-sys",
]
csr = ["leptos/csr", "dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]
hydrated = ["ssr", "hydrate"]

[dependencies]
leptos = { version = "0.8", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
http = { version = "1.0" }
web-sys = { version = "0.3", optional = true, features = [
    "UrlSearchParams",
    "Location",
    "Window",
    "Document",
] }
futures-util = { version = "0.3", optional = true }
bytes = "1.11"
server_fn = { version = "0.8", default-features = false }
leptos_hydrated_macro = { path = "./leptos_hydrated_macro", version = "0.1.0" }

[dev-dependencies]
tokio = { version = "1.51", features = ["full"] }
any_spawner = { version = "0.3.0", features = ["tokio"] }
axum = "0.8"
leptos_router = "0.8"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[workspace]
members = [
    "leptos_hydrated_macro",
    "examples/hydrate_showcase",
    "examples/offline_pwa",
]

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"
strip = true
