<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preload" href="{{WASM_PATH}}" as="fetch" type="application/wasm" crossorigin>
    <link rel="modulepreload" href="{{JS_PATH}}">
    <link rel="stylesheet" href="{{CSS_PATH}}">
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/svg+xml" href="/icon.svg?v={{VERSION}}">
    <meta name="theme-color" content="#ffffff" />
    <title>Offline Todo (Fallback)</title>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
</head>

<body>
    <script type="module">
        import init, { hydrate } from '{{JS_PATH}}';
        init({ module_or_path: '{{WASM_PATH}}' }).then(() => {
            hydrate();
        });
    </script>
</body>

</html>
